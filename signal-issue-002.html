  document.getElementById('issueLabel').textContent = `Issue ${pad(data.issue)}`;
  document.getElementById('dateLabel').textContent = data.date_display;
  document.getElementById('readLabel').textContent = `${data.read_minutes}-min read ☕`;
  document.getElementById('tagline').textContent = data.tagline;

  // Editor note
  const initial = (data.editor_name || 'S').slice(0,1).toUpperCase();
  document.getElementById('editorAvatar').textContent = initial;
  document.getElementById('editorFrom').textContent = `From ${data.editor_name}`;
  document.getElementById('editorNote').textContent = data.editor_note;

  // Preview strip
  const previewList = document.getElementById('previewList');
  data.preview.forEach((p, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="emoji">${p.emoji}</span><span class="tag">${p.label} · 0${i+1}</span><span class="title">${p.title}</span>`;
    previewList.appendChild(li);
  });
  document.getElementById('previewExtra').textContent = `+ five quick hits, one chart, and one fun thing involving a robot.`;

  // Chart
  document.getElementById('chartTitle').textContent = data.chart.title;
  document.getElementById('chartCaption').textContent = data.chart.caption;
  const ctx = document.getElementById('cveChart');
  const colors = data.chart.values.map((_, i) => i === data.chart.highlight_index ? '#E65525' : '#FFE0CF');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: data.chart.labels,
      datasets: [{
        data: data.chart.values,
        backgroundColor: colors,
        borderRadius: 8,
        barThickness: 38
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor:'#2A1F1A', titleFont:{family:'Inter',weight:'600'}, bodyFont:{family:'Inter'} } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'Inter', size: 11, weight: '500' }, color: '#8C7D72' } },
        y: { grid: { color: '#F5EBDB' }, border: { display: false }, ticks: { font: { family: 'Inter', size: 11 }, color: '#8C7D72', stepSize: 5 }, beginAtZero: true }
      }
    }
  });

  // Stories
  const storiesRoot = document.getElementById('storiesRoot');
  data.stories.forEach(s => {
    const linkHTML = s.link ? ` <a href="${s.link.url}">${s.link.label} ↗</a>` : '';
    const article = document.createElement('article');
    article.className = 'story';
    article.setAttribute('data-color', s.color);
    article.innerHTML = `
      <div class="story-kicker">${s.kicker}</div>
      <h2>${s.title}</h2>
      <div class="why">
        <span class="stamp">Why you'd care</span>
        <span>${s.why_you_care}</span>
      </div>
      <p class="body">${s.body}${linkHTML}</p>
      <details class="more">
        <summary>More on this</summary>
        <div class="body-deep">${s.more}</div>
      </details>
    `;
    storiesRoot.appendChild(article);
  });

  // Quick hits
  const qhRoot = document.getElementById('qhRoot');
  data.quick_hits.forEach((q, i) => {
    const linkHTML = q.link ? ` <a href="${q.link.url}">${q.link.label} ↗</a>` : '';
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="text"><span class="lede">${q.lede}</span> ${q.text}${linkHTML}</div>
    `;
    qhRoot.appendChild(item);
  });

  // Fun fact
  document.getElementById('funTitle').textContent = data.fun_fact.title;
  document.getElementById('funBody').textContent = data.fun_fact.body;

  // Footer / reader loop
  document.getElementById('signoff').textContent = `— ${data.editor_name} 👋  See you next Monday.`;
  const replyHref = `mailto:${data.reply_to}?subject=Signal%20%23${pad(data.issue)}%20%E2%80%94%20one%20word%20reply&body=One%20word%20on%20this%20week%27s%20issue%3A%20`;
  document.getElementById('replyAction').setAttribute('href', replyHref);
  document.getElementById('archiveAction').setAttribute('href', data.archive_url);
  document.getElementById('forwardAction').setAttribute('href', `mailto:?subject=You%20might%20like%20Signal&body=I%27ve%20been%20reading%20this%20weekly%20AI%20newsletter%20%E2%80%94%20you%27d%20probably%20like%20it.`);
  document.getElementById('colophon').innerHTML = `<strong>Signal</strong> · Issue ${pad(data.issue)} · ${data.date_display} · ${data.sources_count} sources this week<br/>Built with care, served warm.`;
})();
</script>
</body>
</html>
